<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pincode Explorer</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="bg-gradient-to-r from-orange-400 to-orange-100
             dark:from-gray-900 dark:to-gray-700
             min-h-screen">
    <header class="text-gray-600 body-font">
      <div
        class="container mx-auto flex flex-wrap p-5 flex-col md:flex-row items-center justify-between"
      >
        <a
          class="flex title-font font-medium items-center text-gray-900 mb-4 md:mb-0 flex items-center justify-center"
        >
          <i class="fa-solid fa-envelope text-4xl"></i>
          <span class="ml-3 text-2xl"> India PIN Code Finder <br> <p class="text-[20px] text-gray-700">Post offices, districts & delivery details</p></span>
          
        </a>

        
      </div>
    </header>

    <div class="text-center">
      <div class="">
        <h1 class="text-5xl mt-20 font-bold">
          Find any <span class="text-orange-800">Post office</span> <br />
          across India in seconds
        </h1>

        <p class="mt-7 text-2xl text-gray-800">
          Enter a 6-digit PIN code to instantly see locality, district, state,
          <br />
          delivery status and branch details from the official postal directory.
        </p>
      </div>
    </div>

    <div
      class="w-[600px] mx-auto flex bg-white items-center mt-10 justify-center p-2 rounded-xl gap-10"
    >
      <input
        type="text"
        placeholder="Enter Indian PIN code"
        class="w-[500px] py-4 outline-none"
        id="inputtext"
      />

      <button
        class="bg-red-500 px-3 py-2 rounded-2xl flex items-center justify-center gap-3 font-bold hover:bg-red-800"
        onclick="Getpincode()"
      >
        <i class="fa-solid fa-magnifying-glass"></i> Search
      </button>
    </div>


    <div
  id="result"
  class="w-[900px] mx-auto mt-10 p-6    rounded-xl "
></div>
    <script src="script.js"></script>
  </body>
</html>
