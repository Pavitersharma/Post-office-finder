<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pincode Explorer</title>

    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body
    class="bg-gradient-to-r from-orange-400 to-orange-100 dark:from-gray-900 dark:to-gray-700 min-h-screen"
  >
    <!-- Header -->
    <header class="text-gray-600 body-font">
      <div
        class="container mx-auto flex flex-wrap p-5 flex-col md:flex-row items-center justify-between"
      >
        <a
          class="flex title-font font-medium items-center text-gray-900 mb-4 md:mb-0 justify-center text-center md:text-left"
        >
          <i class="fa-solid fa-envelope text-3xl md:text-4xl"></i>

          <span class="ml-3 text-lg md:text-2xl">
            India PIN Code Finder
            <br />
            <p class="text-sm md:text-[20px] text-gray-700">
              Post offices, districts & delivery details
            </p>
          </span>
        </a>
      </div>
    </header>

    <!-- Hero Section -->
    <div class="text-center px-4">
      <div>
        <h1 class="text-3xl md:text-5xl mt-10 md:mt-20 font-bold">
          Find any <span class="text-orange-800">Post office</span>
          <br />
          across India in seconds
        </h1>

        <p class="mt-7 text-lg md:text-2xl text-gray-800">
          Enter a 6-digit PIN code to instantly see locality, district,
          state,
          <br class="hidden md:block" />
          delivery status and branch details from the official postal
          directory.
        </p>
      </div>
    </div>

    <!-- Search Box -->
    <div
      class="w-[95%] max-w-[600px] mx-auto flex flex-col md:flex-row bg-white items-center mt-10 justify-center p-3 rounded-xl gap-4 shadow-lg"
    >
      <input
        type="text"
        placeholder="Enter Indian PIN code"
        class="w-full md:w-[500px] py-4 px-3 outline-none"
        id="inputtext"
      />

      <button
        class="bg-red-500 px-5 py-3 rounded-2xl flex items-center justify-center gap-3 font-bold hover:bg-red-800 w-full md:w-auto"
        onclick="Getpincode()"
      >
        <i class="fa-solid fa-magnifying-glass"></i>
        Search
      </button>
    </div>

    <!-- Result Container -->
    <div
      id="result"
      class="w-[95%] max-w-[900px] mx-auto mt-10 p-4 md:p-6 rounded-xl"
    ></div>

    <script src="script.js"></script>
  </body>
</html>
